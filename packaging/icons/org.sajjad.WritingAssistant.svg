<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="50%" stop-color="#252739"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="quillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Rounded Card -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Subtle Accent Ring -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="rgba(96,165,250,0.15)" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Feather / Quill Stylized Silhouette -->
  <path d="M78 28 C64 34 50 48 44 64 C42 70 41 78 40 88 C49 84 58 81 64 78 C78 70 88 56 92 40 C93 36 90 31 86 30 Z" fill="url(#quillGrad)"/>
  <path d="M40 88 L35 94 C33.5 95.5 35 97 37 96 L44 91 Z" fill="#c084fc"/>

  <!-- Central Pen Slit -->
  <path d="M52 68 L70 44" stroke="#1e1e2e" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Primary AI Sparkle (Top Right) -->
  <path d="M96 22 Q96 34 108 34 Q96 34 96 46 Q96 34 84 34 Q96 34 96 22 Z" fill="url(#sparkleGrad)"/>

  <!-- Secondary AI Sparkle (Bottom Left) -->
  <path d="M28 72 Q28 80 36 80 Q28 80 28 88 Q28 80 20 80 Q28 80 28 72 Z" fill="url(#sparkleGrad)"/>
</svg>
